name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Create release
        run: |
          mkdir -p build
          zip -r build/release.zip "scripts" "mod.toml"
      - uses: actions/upload-artifact@v7
        with:
          name: mod
          path: build/release.zip
          if-no-files-found: error
          archive: false
