name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Create release
        run: |
          mkdir -p build
          zip -r build/release.zip . -x ".git/*" ".gitignore" ".github/*" "build/*"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: build/release.zip
          if-no-files-found: error
          archive: false
