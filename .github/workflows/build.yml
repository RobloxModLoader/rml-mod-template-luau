name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build release
        run: |
          rm -rf build
          mkdir -p build
          zip -r "build/release.zip" scripts mod.toml
      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          files: build/release.zip
